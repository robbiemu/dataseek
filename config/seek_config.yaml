# Mission Configuration for Data Seek Agent
# This file contains the mission parameters and configuration for the Data Seek Agent, separated from the main claimify config.

model_defaults:
  model: "openai/gpt-5.4-mini"
  temperature: 1
  # No max_tokens default: let the server/model decide the output budget.
  # A hardcoded cap truncates reasoning models mid-thought. Set model_defaults.max_tokens
  # or a per-node max_tokens only when you need an explicit cap.
  # Retries at the litellm/langchain transport layer on transient transport/5xx/429
  # errors. Raise for flaky local servers (e.g. sglang with a small request queue),
  # leave default for cloud. Per-node overrides in mission_plan.nodes win.
  max_retries: 3
  # Stream completions. On by default: long local-server generations with
  # streaming off hold an idle socket that can get reset mid-generation
  # (InternalServerError/Connection error). Streaming keeps the connection alive.
  streaming: true
  # LLM rate limiting (optional; absent = mode "off", no limiting — the default).
  # Two modes, settable here and per-node (node wins over model_defaults):
  #
  #   rate_limit:
  #     mode: manual   # operator-fed quota via the DSL string below
  #     limits: "30m #burst, 500h #steady, 10000d"
  #     scope: model   # default; "provider" shares across models under one key
  #
  #   rate_limit:
  #     mode: real     # follow the server's HTTP rate-limit headers
  #     # limits optional in real mode; used as a fallback ceiling if the server
  #     # sends no headers (e.g. "10s" caps at 10 requests/second)
  #
  # DSL grammar: "<count><unit> [#role][, <count><unit> [#role]]..."
  #   unit: s (second) | m (minute) | h (hour) | d (day)
  #   This is COUNT-PLUS-WINDOW, not a duration: "30m" = 30 requests per minute.
  #   Multiple limits compose; the tightest active bound wins at runtime.
  #   #role is a freeform tag (burst, steady, free-tier) for logging which bound
  #   gated a call. MUST be YAML-quoted because "#role" is a YAML comment.
  #
  # scope: "model" (default) keys on the full model identity — two nodes pointing
  #   at the same model+api_base share a quota. "provider" keys on provider +
  #   credential — use when the provider enforces a per-key cross-model limit
  #   (e.g. OpenRouter/Nvidia free tier: 550b + hy3 share one 32/window quota).
  # rate_limit: {mode: off}

web_search:
  provider: "google/search"
  # Override global robots behavior just for web_search (optional)
  respect_robots: true
  # Requests per second for providers without header-based rate limits (optional)
  requests_per_second: 2.0
  # Canonical result cap for providers that support it
  max_results: 10

recursion_per_sample: 35 # 11 allows for 2 retries at research (4n + 3)
initial_prompt: |
  Begin the data prospecting mission based on your configured mission plan.

# Observability configuration for LangSmith
# You can also set these via environment variables:
# - LANGCHAIN_API_KEY or LANGSMITH_API_KEY (required for tracing)
# - LANGCHAIN_TRACING_V2 or LANGSMITH_TRACING (enable/disable tracing)
# - LANGCHAIN_ENDPOINT or LANGSMITH_ENDPOINT (custom endpoint)
# - LANGCHAIN_PROJECT or LANGSMITH_PROJECT (project name)
#
# Note: LiteLLM may show a non-blocking error about logger initialization when the seek
# agent starts. This is expected behavior and does not affect functionality - LangSmith
# tracing will work correctly despite this initial error message. The error occurs because 
# LiteLLM tries to initialize its custom logger during import, but in subprocess contexts 
# there may not be an event loop available yet. This is purely informational and can be ignored.
observability:
  tracing: true  # Enable/disable tracing
  # api_key: "your-langsmith-api-key"  # Not recommended in config files, use environment variables instead
  endpoint: "https://api.smith.langchain.com"  # Custom endpoint for self-hosted deployments
  project: "dataseek"  # Project name for organizing traces

nodes:
  research:
    max_iterations: 7
  supervisor:
    # Number of characters from a failed fitness report's reason
    # to include in supervisor logs for quick diagnosis
    fitness_reason_log_chars: 160

mission_plan:
  goal: "Find reliable, verifiable data sources to build a training corpus about the safety and efficacy of GLP-1 agonists for weight loss."
  nodes:
    - name: "supervisor"
      model: "openai/gpt-5.5"
      temperature: 1
    - name: "research"
      model: "openai/gpt-5.5"
      temperature: 1
      result_char_limit: 65536
      summary_char_limit: 6000
    - name: "fitness"
      model: "openai/gpt-5.5"
      temperature: 1
    - name: "archive"
      model: "openai/gpt-5.4-mini"
      temperature: 1
    - name: "synthetic"
      model: "openai/gpt-5.4-mini"
      temperature: 1



checkpointer_path: ".checkpointer.sqlite"
